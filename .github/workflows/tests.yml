name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar librerías nativas de WeasyPrint
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Correr tests
        run: pytest tests/ -v

      - name: Recordar actualizar backlog
        if: success() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo '✅ CI pasó. Si este PR cierra un ítem, tildalo en `docs/backlog.md` antes de mergear.' > /tmp/comment.md
          echo '' >> /tmp/comment.md
          echo 'Próximos pendientes en el backlog:' >> /tmp/comment.md
          echo '```' >> /tmp/comment.md
          grep -n '^- \[ \]' docs/backlog.md | head -5 >> /tmp/comment.md
          echo '```' >> /tmp/comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comment.md
