# WeasyPrint (services/pdf_service.py) necesita las librerías nativas de
# Pango/GObject/Cairo en tiempo de ejecución. Nixpacks no las instala solas
# a partir de requirements.txt (son binarios del sistema, no paquetes pip).
# "pango" solo no alcanza: WeasyPrint no encuentra libgobject-2.0 si "glib"
# y "gobject-introspection" no están explícitos también (issue conocido de
# WeasyPrint en builds Nixpacks/Railway). "..." extiende los paquetes que
# el provider (Python) detecta solo, no los reemplaza.
# Ver docs/adr/001-stack-tecnologico.md.
[phases.setup]
nixPkgs = ["...", "pango", "glib", "gobject-introspection", "cairo", "libffi"]
